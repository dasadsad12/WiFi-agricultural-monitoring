<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#123d36">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://server.example.com:18127; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>WiFi智慧农业监测</title>
  <link rel="icon" href="./icon-agri.png">
  <link rel="stylesheet" href="./css/app.css?v=agri-control-20261024-03">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-mark"><i data-lucide="sprout"></i></div>
      <div class="brand-copy"><button class="brand-title" type="button" data-action="edit-app-title" aria-label="修改项目名称"><strong data-app-title>WiFi智慧农业监测</strong></button><span>水位 · CO₂ · 土壤湿度 · 补光联动</span></div>
      <div class="topbar-actions">
        <button class="icon-button" type="button" data-action="refresh" aria-label="刷新数据" title="刷新数据"><i data-lucide="refresh-cw"></i></button>
        <button class="icon-button" type="button" data-action="connection" aria-label="连接状态" title="连接状态"><i data-lucide="wifi"></i></button>
      </div>
    </header>

    <main id="view-root" class="view-root" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button type="button" data-nav="overview"><i data-lucide="layout-dashboard"></i><span>总览</span></button>
      <button type="button" data-nav="tunnel"><i data-lucide="map"></i><span>农业区域</span></button>
      <button type="button" data-nav="alerts" class="nav-alert"><i data-lucide="bell"></i><span>报警中心</span><b id="alert-count" class="nav-badge is-hidden">0</b></button>
      <button type="button" data-nav="reports"><i data-lucide="bar-chart-3"></i><span>数据报表</span></button>
      <button type="button" data-nav="settings"><i data-lucide="settings-2"></i><span>设置</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="./vendor/lucide.min.js"></script>
  <script src="./js/config.js?v=agri-control-20261024-03"></script>
  <script src="./js/store.js?v=agri-control-20261024-03"></script>
  <script src="./js/api.js?v=agri-control-20261024-03"></script>
  <script src="./js/app.js?v=agri-control-20261024-03"></script>
</body>
</html>
